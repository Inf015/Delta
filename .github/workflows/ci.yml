name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Las pruebas cubren parsers, normalización de pistas y motor de análisis: lógica
      # pura, sin base de datos ni Redis. Por eso corren acá sin levantar la pila entera.
      - name: Pruebas
        run: pytest -q
